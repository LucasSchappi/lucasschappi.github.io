<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Simulator — Schappi Studios</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; cursor: crosshair; }
canvas { display: block; }
#hud {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
.hud-box {
  position: absolute; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,255,100,0.4);
  color: #0f0; font-family: 'Courier New', monospace; font-size: 14px; padding: 10px 14px;
  border-radius: 4px; backdrop-filter: blur(4px);
}
#hud-left { top: 20px; left: 20px; }
#hud-right { top: 20px; right: 20px; text-align: right; }
.hud-label { color: #0a8; font-size: 11px; }
.hud-value { font-size: 18px; font-weight: bold; }
#crosshair {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 30px; height: 30px;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(0,255,100,0.5);
}
#crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
#crosshair::after { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }
#overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.7); pointer-events: all; z-index: 20;
}
#overlay.hidden { display: none; }
#overlay h1 {
  font-size: 52px; color: #fff; font-family: 'Segoe UI', Arial, sans-serif;
  margin-bottom: 8px; letter-spacing: 6px; font-weight: 300;
}
#overlay .sub { color: #0f0; font-family: 'Courier New', monospace; font-size: 16px; margin-bottom: 40px; }
#overlay .prompt { color: #ccc; font-size: 20px; font-family: 'Segoe UI', Arial, sans-serif; animation: pulse 1.5s infinite; }
#overlay .controls-info {
  color: #888; font-family: 'Courier New', monospace; font-size: 13px;
  margin-top: 35px; line-height: 2; text-align: center;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
#throttle-bar {
  position: absolute; left: 20px; bottom: 60px; width: 12px; height: 150px;
  border: 1px solid rgba(0,255,100,0.4); background: rgba(0,0,0,0.4); border-radius: 3px;
}
#throttle-fill {
  position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #0a0, #0f0); border-radius: 2px;
  transition: height 0.1s;
}
#throttle-label { position: absolute; left: 20px; bottom: 40px; color: #0a8; font-family: 'Courier New', monospace; font-size: 11px; }
#stall-warning {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -80px);
  color: #f00; font-family: 'Courier New', monospace; font-size: 24px; font-weight: bold;
  text-shadow: 0 0 10px #f00; display: none; animation: blink 0.4s infinite;
}
#flaps-indicator {
  position: absolute; left: 20px; bottom: 220px; color: #ff0; font-family: 'Courier New', monospace;
  font-size: 12px; text-shadow: 0 0 6px #ff0; display: none;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>
</head>
<body>
<div id="hud">
  <div class="hud-box" id="hud-left">
    <div><span class="hud-label">SPEED</span><br><span class="hud-value" id="v-speed">0</span> <span class="hud-label">KTS</span></div>
    <br>
    <div><span class="hud-label">ALTITUDE</span><br><span class="hud-value" id="v-alt">0</span> <span class="hud-label">FT</span></div>
    <br>
    <div><span class="hud-label">VSPEED</span><br><span class="hud-value" id="v-vspeed">0</span> <span class="hud-label">FPM</span></div>
  </div>
  <div class="hud-box" id="hud-right">
    <div><span class="hud-label">HEADING</span><br><span class="hud-value" id="v-heading">0</span>&deg;</div>
    <br>
    <div><span class="hud-label">PITCH</span><br><span class="hud-value" id="v-pitch">0</span>&deg;</div>
    <br>
    <div><span class="hud-label">BANK</span><br><span class="hud-value" id="v-bank">0</span>&deg;</div>
  </div>
  <div id="crosshair"></div>
  <div id="throttle-label">THR</div>
  <div id="throttle-bar"><div id="throttle-fill" style="height:60%"></div></div>
  <div id="stall-warning">STALL</div>
  <div id="flaps-indicator">FLAPS</div>
</div>
<div id="overlay">
  <h1>FLIGHT SIM</h1>
  <div class="sub">3D Flight Simulator</div>
  <div class="prompt">Click or press SPACE to fly</div>
  <div class="controls-info">
    W / S &mdash; Pitch up / down<br>
    A / D &mdash; Roll left / right<br>
    Q / E &mdash; Yaw left / right<br>
    SHIFT / CTRL &mdash; Throttle up / down<br>
    F &mdash; Flaps toggle
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const TERRAIN_SIZE = 4000;
  const TERRAIN_SEGS = 200;
  const START_ALT = 500;
  const START_SPEED = 80;
  const MAX_SPEED = 400;
  const STALL_SPEED = 40;
  const GRAVITY = 9.8;
  const PITCH_RATE = 1.4;
  const ROLL_RATE = 2.2;
  const YAW_RATE = 0.6;

  let playing = false;
  let throttle = 0.6;
  let airspeed = START_SPEED;
  let crashed = false;
  let flaps = false;
  let keys = {};
  let elapsed = 0;

  // ===== RENDERER =====
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.5, 12000);

  // ===== SUN DIRECTION =====
  const SUN_DIR = new THREE.Vector3(0.4, 0.6, -0.3).normalize();

  // ===== SKY DOME =====
  const skyGeo = new THREE.SphereGeometry(5000, 32, 24);
  const skyVerts = skyGeo.attributes.position.array;
  const skyColors = new Float32Array(skyVerts.length);
  for (let i = 0; i < skyVerts.length; i += 3) {
    const y = skyVerts[i + 1] / 5000; // -1 to 1
    const x = skyVerts[i] / 5000, z = skyVerts[i + 2] / 5000;
    // Angle towards sun for scattering
    const vDir = new THREE.Vector3(x, y, z).normalize();
    const sunDot = Math.max(0, vDir.dot(SUN_DIR));
    let r, g, b;
    if (y > 0.6) {
      // Zenith - deep blue
      const t = (y - 0.6) / 0.4;
      r = 0.18 - t * 0.06; g = 0.32 - t * 0.08; b = 0.72 + t * 0.08;
    } else if (y > 0.15) {
      // Mid sky - blue to lighter
      const t = (y - 0.15) / 0.45;
      r = 0.42 - t * 0.24; g = 0.55 - t * 0.23; b = 0.78 - t * 0.06;
    } else if (y > -0.02) {
      // Horizon band - pale warm haze
      const t = (y + 0.02) / 0.17;
      r = 0.78 - t * 0.36; g = 0.72 - t * 0.17; b = 0.68 + t * 0.10;
    } else {
      // Below horizon - ground haze
      r = 0.78; g = 0.72; b = 0.68;
    }
    // Mie scattering: warm glow around sun
    const mie = Math.pow(sunDot, 12) * 0.5;
    const rayleigh = Math.pow(sunDot, 3) * 0.12;
    r += mie * 1.0 + rayleigh * 0.8;
    g += mie * 0.7 + rayleigh * 0.4;
    b += mie * 0.3 + rayleigh * 0.2;
    // Horizon brightening near sun
    if (y < 0.2 && y > -0.02) {
      const hBright = Math.pow(sunDot, 4) * 0.25 * (1 - (y + 0.02) / 0.22);
      r += hBright; g += hBright * 0.7; b += hBright * 0.3;
    }
    r = Math.min(1, r); g = Math.min(1, g); b = Math.min(1, b);
    skyColors[i] = r; skyColors[i+1] = g; skyColors[i+2] = b;
  }
  skyGeo.setAttribute('color', new THREE.BufferAttribute(skyColors, 3));
  const skyMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  // Fog to match horizon
  scene.fog = new THREE.FogExp2(0xb8cce8, 0.00018);

  // ===== SUN =====
  const sunPos = SUN_DIR.clone().multiplyScalar(4500);

  // Sun disc
  const sunGeo = new THREE.SphereGeometry(60, 16, 16);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xfffbe8 });
  const sunMesh = new THREE.Mesh(sunGeo, sunMat);
  sunMesh.position.copy(sunPos);
  scene.add(sunMesh);

  // Sun glow layers
  for (let i = 0; i < 4; i++) {
    const s = 100 + i * 80;
    const glowGeo = new THREE.SphereGeometry(s, 12, 12);
    const glowMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(0.1, 0.3, 0.95),
      transparent: true, opacity: 0.08 - i * 0.015,
      side: THREE.BackSide, depthWrite: false,
    });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    glowMesh.position.copy(sunPos);
    scene.add(glowMesh);
  }

  // ===== LIGHTS =====
  const ambient = new THREE.AmbientLight(0x7799bb, 0.4);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xfff0d0, 1.4);
  sun.position.copy(sunPos.clone().normalize().multiplyScalar(500));
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  sun.shadow.camera.near = 5;
  sun.shadow.camera.far = 1500;
  sun.shadow.camera.left = -300;
  sun.shadow.camera.right = 300;
  sun.shadow.camera.top = 300;
  sun.shadow.camera.bottom = -300;
  sun.shadow.bias = -0.0002;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);
  scene.add(sun.target);

  // Fill light from opposite side (sky bounce)
  const fillLight = new THREE.DirectionalLight(0x8ab4d8, 0.3);
  fillLight.position.set(-200, 100, 200);
  scene.add(fillLight);

  const hemi = new THREE.HemisphereLight(0x88bbee, 0x445522, 0.35);
  scene.add(hemi);

  // ===== TERRAIN =====
  function generateTerrain() {
    const geo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGS, TERRAIN_SEGS);
    geo.rotateX(-Math.PI / 2);
    const verts = geo.attributes.position.array;

    function noise2D(x, z, scale, amp) {
      const nx = x * scale, nz = z * scale;
      return (Math.sin(nx * 1.1 + nz * 0.7) * Math.cos(nz * 1.3 - nx * 0.5) +
              Math.sin(nx * 0.4 + nz * 1.8) * 0.5 +
              Math.cos(nx * 2.1 - nz * 1.1) * 0.3) * amp;
    }
    function ridgeNoise(x, z, scale, amp) {
      const nx = x * scale, nz = z * scale;
      const v = Math.sin(nx * 1.1 + nz * 0.7) * Math.cos(nz * 1.3 - nx * 0.5) +
                Math.sin(nx * 0.4 + nz * 1.8) * 0.5;
      return (1 - Math.abs(v)) * amp; // ridge transform
    }

    for (let i = 0; i < verts.length; i += 3) {
      const x = verts[i], z = verts[i + 2];
      let h = 0;
      // Large mountain ranges
      h += noise2D(x, z, 0.0008, 120);
      h += ridgeNoise(x, z, 0.0015, 80);
      // Mid-scale hills
      h += noise2D(x, z, 0.004, 40);
      h += ridgeNoise(x, z, 0.008, 20);
      // Smaller detail
      h += noise2D(x, z, 0.02, 10);
      h += noise2D(x, z, 0.05, 4);
      h += noise2D(x, z, 0.12, 1.5);
      h += noise2D(x, z, 0.25, 0.5);
      h = Math.max(h, -3);
      verts[i + 1] = h;
    }
    geo.computeVertexNormals();

    const colors = new Float32Array(verts.length);
    for (let i = 0; i < verts.length; i += 3) {
      const h = verts[i + 1];
      let r, g, b;
      if (h < -1) { r = 0.10; g = 0.25; b = 0.45; }
      else if (h < 3) { r = 0.76; g = 0.72; b = 0.55; }
      else if (h < 30) { r = 0.26; g = 0.50; b = 0.19; }
      else if (h < 60) { r = 0.20; g = 0.40; b = 0.14; }
      else if (h < 100) { r = 0.38; g = 0.36; b = 0.28; }
      else if (h < 150) { r = 0.52; g = 0.48; b = 0.42; }
      else if (h < 200) { r = 0.65; g = 0.62; b = 0.58; }
      else { r = 0.92; g = 0.93; b = 0.96; }
      const v = (Math.random() - 0.5) * 0.04;
      colors[i] = r + v; colors[i+1] = g + v; colors[i+2] = b + v;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.9, metalness: 0.02,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    mesh.castShadow = false;
    scene.add(mesh);
    return { mesh, geo };
  }
  const terrain = generateTerrain();

  // ===== WATER =====
  const waterGeo = new THREE.PlaneGeometry(TERRAIN_SIZE * 3, TERRAIN_SIZE * 3, 80, 80);
  waterGeo.rotateX(-Math.PI / 2);
  const waterMat = new THREE.MeshStandardMaterial({
    color: 0x1a7099, transparent: true, opacity: 0.65,
    roughness: 0.05, metalness: 0.6, envMapIntensity: 1.0,
  });
  const waterMesh = new THREE.Mesh(waterGeo, waterMat);
  waterMesh.position.y = -1;
  waterMesh.receiveShadow = true;
  scene.add(waterMesh);
  const waterBaseY = new Float32Array(waterGeo.attributes.position.array.length);
  waterBaseY.set(waterGeo.attributes.position.array);

  function animateWater(t) {
    const pos = waterGeo.attributes.position.array;
    for (let i = 0; i < pos.length; i += 3) {
      const x = waterBaseY[i], z = waterBaseY[i + 2];
      pos[i + 1] = waterBaseY[i + 1] +
        Math.sin(x * 0.015 + t * 1.2) * 0.6 +
        Math.cos(z * 0.012 + t * 0.9) * 0.4 +
        Math.sin((x + z) * 0.008 + t * 0.6) * 0.8;
    }
    waterGeo.attributes.position.needsUpdate = true;
    waterGeo.computeVertexNormals();
  }

  // ===== CLOUDS =====
  const cloudGroup = new THREE.Group();
  scene.add(cloudGroup);
  const cloudMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, transparent: true, opacity: 0.7,
    roughness: 1, metalness: 0, emissive: 0x333333, emissiveIntensity: 0.1,
  });
  for (let i = 0; i < 80; i++) {
    const cGroup = new THREE.Group();
    const puffs = 4 + Math.floor(Math.random() * 6);
    for (let j = 0; j < puffs; j++) {
      const s = 20 + Math.random() * 40;
      const g = new THREE.SphereGeometry(s, 8, 6);
      const m = new THREE.Mesh(g, cloudMat);
      m.position.set((Math.random()-0.5)*s*2.5, (Math.random()-0.5)*s*0.25, (Math.random()-0.5)*s*2.5);
      m.scale.y = 0.35 + Math.random() * 0.15;
      cGroup.add(m);
    }
    cGroup.position.set(
      (Math.random()-0.5) * TERRAIN_SIZE * 1.5,
      150 + Math.random() * 500,
      (Math.random()-0.5) * TERRAIN_SIZE * 1.5
    );
    cGroup.userData.driftX = (Math.random() - 0.5) * 2;
    cGroup.userData.driftZ = (Math.random() - 0.5) * 2;
    cloudGroup.add(cGroup);
  }

  // ===== TREES =====
  const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2a0a, roughness: 0.9 });
  const treeLeafMat = new THREE.MeshStandardMaterial({ color: 0x1a6618, roughness: 0.85 });
  const treeGroup = new THREE.Group();
  scene.add(treeGroup);
  const tVerts = terrain.geo.attributes.position.array;
  for (let i = 0; i < 500; i++) {
    const vi = Math.floor(Math.random() * (tVerts.length / 3)) * 3;
    const tx = tVerts[vi], ty = tVerts[vi+1], tz = tVerts[vi+2];
    if (ty < 5 || ty > 80) continue;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 5, 5), treeTrunkMat);
    trunk.position.set(tx, ty + 2.5, tz);
    trunk.castShadow = true;
    treeGroup.add(trunk);
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(3.5, 9, 6), treeLeafMat);
    leaves.position.set(tx, ty + 8, tz);
    leaves.castShadow = true;
    treeGroup.add(leaves);
  }

  // ===== PLANE MODEL =====
  const planeGroup = new THREE.Group();
  scene.add(planeGroup);

  // Fuselage - shinier
  const fuseMat = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, metalness: 0.5, roughness: 0.35 });
  const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.3, 6, 12), fuseMat);
  fuse.rotation.x = Math.PI / 2;
  planeGroup.add(fuse);

  // Cockpit canopy (glass)
  const canopyMat = new THREE.MeshStandardMaterial({
    color: 0x4488cc, metalness: 0.8, roughness: 0.1, transparent: true, opacity: 0.6,
  });
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2), canopyMat);
  canopy.position.set(0, 0.35, -0.8);
  canopy.scale.set(0.8, 0.7, 1.2);
  planeGroup.add(canopy);

  // Nose cone
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xdd2222, metalness: 0.4, roughness: 0.35 });
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 12), noseMat);
  nose.rotation.x = -Math.PI / 2;
  nose.position.z = -3.7;
  planeGroup.add(nose);

  // Wings
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, metalness: 0.4, roughness: 0.4 });
  const wings = new THREE.Mesh(new THREE.BoxGeometry(13, 0.12, 2), wingMat);
  wings.position.set(0, -0.05, 0.2);
  planeGroup.add(wings);

  // Ailerons (slight darker at trailing edge)
  const aileronMat = new THREE.MeshStandardMaterial({ color: 0xbbbbbb, metalness: 0.3, roughness: 0.5 });
  const aileronL = new THREE.Mesh(new THREE.BoxGeometry(3, 0.08, 0.5), aileronMat);
  aileronL.position.set(-4.5, -0.05, 1.1);
  planeGroup.add(aileronL);
  const aileronR = new THREE.Mesh(new THREE.BoxGeometry(3, 0.08, 0.5), aileronMat);
  aileronR.position.set(4.5, -0.05, 1.1);
  planeGroup.add(aileronR);

  // Wing tips - navigation lights
  const tipMatRed = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 1.0 });
  const tipMatGreen = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 1.0 });
  const ltip = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), tipMatRed);
  ltip.position.set(-6.6, 0, 0.2);
  planeGroup.add(ltip);
  const rtip = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), tipMatGreen);
  rtip.position.set(6.6, 0, 0.2);
  planeGroup.add(rtip);

  // Nav light point lights
  const navLightL = new THREE.PointLight(0xff0000, 2, 15);
  navLightL.position.set(-6.6, 0, 0.2);
  planeGroup.add(navLightL);
  const navLightR = new THREE.PointLight(0x00ff00, 2, 15);
  navLightR.position.set(6.6, 0, 0.2);
  planeGroup.add(navLightR);

  // Tail strobe
  const strobeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.0 });
  const strobe = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), strobeMat);
  strobe.position.set(0, 0.5, 3.2);
  planeGroup.add(strobe);
  const strobeLight = new THREE.PointLight(0xffffff, 3, 25);
  strobeLight.position.set(0, 0.5, 3.2);
  planeGroup.add(strobeLight);

  // Horizontal stabilizer
  const hstab = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.08, 1.1), wingMat);
  hstab.position.set(0, 0.2, 3);
  planeGroup.add(hstab);

  // Vertical stabilizer
  const vstab = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 1.3), wingMat);
  vstab.position.set(0, 1.2, 2.8);
  planeGroup.add(vstab);
  const rudderTop = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.6), noseMat);
  rudderTop.position.set(0, 2.35, 3);
  planeGroup.add(rudderTop);

  // Engine cowling
  const engineMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.25 });
  const engine = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.42, 1, 12), engineMat);
  engine.rotation.x = Math.PI / 2;
  engine.position.z = -4;
  planeGroup.add(engine);

  // Propeller
  const propGroup = new THREE.Group();
  propGroup.position.z = -4.7;
  const propMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.3, roughness: 0.6 });
  const blade1 = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 0.15), propMat);
  propGroup.add(blade1);
  const blade2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.2, 0.15), propMat);
  propGroup.add(blade2);
  const spinner = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.4, 8), engineMat);
  spinner.rotation.x = -Math.PI / 2;
  spinner.position.z = -0.2;
  propGroup.add(spinner);
  planeGroup.add(propGroup);

  // Landing gear
  const gearMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.5, roughness: 0.4 });
  const lgL = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.5, 4), gearMat);
  lgL.position.set(-1.5, -0.9, 0.5); lgL.rotation.z = 0.15;
  planeGroup.add(lgL);
  const lgR = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.5, 4), gearMat);
  lgR.position.set(1.5, -0.9, 0.5); lgR.rotation.z = -0.15;
  planeGroup.add(lgR);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.2, roughness: 0.8 });
  const wL = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.08, 8, 12), wheelMat);
  wL.rotation.y = Math.PI / 2;
  wL.position.set(-1.7, -1.6, 0.5);
  planeGroup.add(wL);
  const wR = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.08, 8, 12), wheelMat);
  wR.rotation.y = Math.PI / 2;
  wR.position.set(1.7, -1.6, 0.5);
  planeGroup.add(wR);

  planeGroup.traverse(c => { if (c.isMesh) c.castShadow = true; });

  // ===== EXHAUST TRAIL =====
  const MAX_TRAIL = 200;
  const trailPositions = new Float32Array(MAX_TRAIL * 3);
  const trailOpacities = new Float32Array(MAX_TRAIL);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
  const trailMat = new THREE.PointsMaterial({
    color: 0xaaaaaa, size: 0.8, transparent: true, opacity: 0.35,
    blending: THREE.NormalBlending, depthWrite: false, sizeAttenuation: true,
  });
  const trailPoints = new THREE.Points(trailGeo, trailMat);
  scene.add(trailPoints);

  let trailData = [];
  function addTrailPoint(x, y, z) {
    trailData.push({ x, y, z, life: 1 });
    if (trailData.length > MAX_TRAIL) trailData.shift();
  }

  function updateTrail(dt) {
    for (let i = trailData.length - 1; i >= 0; i--) {
      trailData[i].life -= dt * 0.3;
      trailData[i].y += dt * 0.5; // rise slightly
      if (trailData[i].life <= 0) trailData.splice(i, 1);
    }
    for (let i = 0; i < MAX_TRAIL; i++) {
      if (i < trailData.length) {
        trailPositions[i*3] = trailData[i].x;
        trailPositions[i*3+1] = trailData[i].y;
        trailPositions[i*3+2] = trailData[i].z;
      } else {
        trailPositions[i*3+1] = -9999;
      }
    }
    trailGeo.attributes.position.needsUpdate = true;
  }

  // ===== FLIGHT PHYSICS =====
  planeGroup.position.set(0, START_ALT, 0);
  planeGroup.lookAt(0, START_ALT, -1);
  const velocity = new THREE.Vector3(0, 0, -START_SPEED);
  const smoothLookTarget = new THREE.Vector3(0, START_ALT, -20);
  const smoothCamPos = new THREE.Vector3(0, START_ALT + 5, 22);
  let prevTime = performance.now();

  function getTerrainHeight(x, z) {
    function noise2D(x, z, scale, amp) {
      const nx = x * scale, nz = z * scale;
      return (Math.sin(nx * 1.1 + nz * 0.7) * Math.cos(nz * 1.3 - nx * 0.5) +
              Math.sin(nx * 0.4 + nz * 1.8) * 0.5 +
              Math.cos(nx * 2.1 - nz * 1.1) * 0.3) * amp;
    }
    function ridgeNoise(x, z, scale, amp) {
      const nx = x * scale, nz = z * scale;
      const v = Math.sin(nx * 1.1 + nz * 0.7) * Math.cos(nz * 1.3 - nx * 0.5) +
                Math.sin(nx * 0.4 + nz * 1.8) * 0.5;
      return (1 - Math.abs(v)) * amp;
    }
    let h = 0;
    h += noise2D(x, z, 0.0008, 120);
    h += ridgeNoise(x, z, 0.0015, 80);
    h += noise2D(x, z, 0.004, 40);
    h += ridgeNoise(x, z, 0.008, 20);
    h += noise2D(x, z, 0.02, 10);
    h += noise2D(x, z, 0.05, 4);
    h += noise2D(x, z, 0.12, 1.5);
    h += noise2D(x, z, 0.25, 0.5);
    return Math.max(h, -3);
  }

  function updateFlight() {
    const now = performance.now();
    let dt = (now - prevTime) / 1000;
    prevTime = now;
    if (dt > 0.1) dt = 0.1;
    elapsed += dt;

    // Animate water
    animateWater(elapsed);

    // Drift clouds
    cloudGroup.children.forEach(c => {
      c.position.x += c.userData.driftX * dt;
      c.position.z += c.userData.driftZ * dt;
    });

    // Strobe blink
    const strobeOn = Math.sin(elapsed * 8) > 0.8;
    strobe.material.emissiveIntensity = strobeOn ? 2 : 0;
    strobeLight.intensity = strobeOn ? 5 : 0;

    // Flaps indicator
    document.getElementById('flaps-indicator').style.display = flaps ? 'block' : 'none';

    if (!playing || crashed) return;

    // Throttle
    if (keys['ShiftLeft'] || keys['ShiftRight']) throttle = Math.min(1, throttle + dt * 0.5);
    if (keys['ControlLeft'] || keys['ControlRight']) throttle = Math.max(0, throttle - dt * 0.5);

    const thrustForce = throttle * 120;
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(planeGroup.quaternion);
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(planeGroup.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(planeGroup.quaternion);

    airspeed = velocity.length();
    const stalling = airspeed < STALL_SPEED && planeGroup.position.y > 10;
    document.getElementById('stall-warning').style.display = stalling ? 'block' : 'none';

    const controlAuthority = Math.min(airspeed / 80, 1);
    let pitchInput = 0, rollInput = 0, yawInput = 0;
    if (keys['KeyW']) pitchInput = 1;
    if (keys['KeyS']) pitchInput = -1;
    if (keys['KeyA']) rollInput = -1;
    if (keys['KeyD']) rollInput = 1;
    if (keys['KeyQ']) yawInput = -1;
    if (keys['KeyE']) yawInput = 1;

    const pitchQ = new THREE.Quaternion().setFromAxisAngle(right, pitchInput * PITCH_RATE * controlAuthority * dt);
    const rollQ = new THREE.Quaternion().setFromAxisAngle(forward, rollInput * ROLL_RATE * controlAuthority * dt);
    const yawQ = new THREE.Quaternion().setFromAxisAngle(up, yawInput * YAW_RATE * controlAuthority * dt);
    planeGroup.quaternion.premultiply(pitchQ);
    planeGroup.quaternion.premultiply(rollQ);
    planeGroup.quaternion.premultiply(yawQ);
    planeGroup.quaternion.normalize();

    const thrust = forward.clone().multiplyScalar(thrustForce * dt);
    const dragCoeff = flaps ? 0.006 : 0.003;
    const drag = velocity.clone().multiplyScalar(-dragCoeff * airspeed * dt);
    const liftCoeff = flaps ? 0.045 : 0.035;
    let liftMag = liftCoeff * airspeed * controlAuthority;
    if (stalling) liftMag *= 0.2;
    const lift = up.clone().multiplyScalar(liftMag * dt);
    const gravity = new THREE.Vector3(0, -GRAVITY * dt, 0);

    velocity.add(thrust).add(drag).add(lift).add(gravity);
    const spd = velocity.length();
    if (spd > MAX_SPEED) velocity.multiplyScalar(MAX_SPEED / spd);

    const slipDamp = 0.02;
    const rightVel = right.clone().multiplyScalar(velocity.dot(right) * slipDamp);
    velocity.sub(rightVel);

    const alignRate = 0.03;
    velocity.lerp(forward.clone().multiplyScalar(spd), alignRate);

    planeGroup.position.add(velocity.clone().multiplyScalar(dt));

    // Ground collision
    const terrainH = getTerrainHeight(planeGroup.position.x, planeGroup.position.z);
    if (planeGroup.position.y < terrainH + 2) {
      if (airspeed > 50 || Math.abs(up.dot(new THREE.Vector3(0,1,0))) < 0.85) {
        crashed = true; playing = false;
        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');
        overlay.querySelector('h1').textContent = 'CRASHED';
        overlay.querySelector('.sub').textContent = 'Speed: ' + Math.floor(airspeed) + ' kts';
        overlay.querySelector('.prompt').textContent = 'Click or press SPACE to restart';
        overlay.querySelector('.controls-info').textContent = '';
        return;
      }
      planeGroup.position.y = terrainH + 2;
      velocity.y = Math.max(velocity.y, 0);
    }

    // Wrap
    const half = TERRAIN_SIZE * 0.7;
    if (planeGroup.position.x > half) planeGroup.position.x -= half * 2;
    if (planeGroup.position.x < -half) planeGroup.position.x += half * 2;
    if (planeGroup.position.z > half) planeGroup.position.z -= half * 2;
    if (planeGroup.position.z < -half) planeGroup.position.z += half * 2;

    // Propeller spin
    propGroup.rotation.z += throttle * 80 * dt;

    // Exhaust trail
    if (throttle > 0.2) {
      const exhaust = new THREE.Vector3(0, 0, 3.5).applyQuaternion(planeGroup.quaternion).add(planeGroup.position);
      addTrailPoint(exhaust.x + (Math.random()-0.5)*0.2, exhaust.y + (Math.random()-0.5)*0.2, exhaust.z + (Math.random()-0.5)*0.2);
    }
    updateTrail(dt);

    // Camera - double-smoothed for cinematic feel
    const camOffset = new THREE.Vector3(0, 6, 28);
    camOffset.applyQuaternion(planeGroup.quaternion);
    const camTarget = planeGroup.position.clone().add(camOffset);
    smoothCamPos.lerp(camTarget, 0.15);
    camera.position.lerp(smoothCamPos, 0.25);
    const rawLook = planeGroup.position.clone().add(forward.clone().multiplyScalar(-25));
    smoothLookTarget.lerp(rawLook, 0.15);
    camera.lookAt(smoothLookTarget);

    // Shadow follows plane
    sun.position.copy(SUN_DIR.clone().multiplyScalar(300).add(planeGroup.position));
    sun.target.position.copy(planeGroup.position);
    sun.target.updateMatrixWorld();

    // Sky follows camera
    sky.position.copy(camera.position);
    sunMesh.position.copy(SUN_DIR.clone().multiplyScalar(4500).add(camera.position));

    // HUD
    const euler = new THREE.Euler().setFromQuaternion(planeGroup.quaternion, 'YXZ');
    const heading = (((-euler.y * 180 / Math.PI) % 360) + 360) % 360;
    const pitch = -euler.x * 180 / Math.PI;
    const bank = -euler.z * 180 / Math.PI;
    const vspeed = Math.floor(velocity.y * 60 * 3.28);
    document.getElementById('v-speed').textContent = Math.floor(airspeed);
    document.getElementById('v-alt').textContent = Math.floor(planeGroup.position.y * 3.28);
    document.getElementById('v-heading').textContent = Math.floor(heading);
    document.getElementById('v-pitch').textContent = pitch.toFixed(1);
    document.getElementById('v-bank').textContent = bank.toFixed(1);
    document.getElementById('v-vspeed').textContent = vspeed;
    document.getElementById('throttle-fill').style.height = (throttle * 100) + '%';
  }

  // ===== INPUT =====
  function startFlight() {
    if (playing) return;
    playing = true; crashed = false;
    throttle = 0.6; airspeed = START_SPEED;
    planeGroup.position.set(0, START_ALT, 0);
    planeGroup.quaternion.identity();
    planeGroup.lookAt(0, START_ALT, -1);
    velocity.set(0, 0, -START_SPEED);
    camera.position.set(0, START_ALT + 6, 24);
    smoothCamPos.set(0, START_ALT + 6, 24);
    smoothLookTarget.set(0, START_ALT, -25);
    trailData = [];
    prevTime = performance.now();
    document.getElementById('overlay').classList.add('hidden');
  }

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { e.preventDefault(); startFlight(); }
    if (e.code === 'KeyF') flaps = !flaps;
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  // Clicking works too. When the sim is embedded in an iframe the page has to
  // be clicked before it receives key events at all, so the click both focuses
  // this window and starts the flight.
  window.addEventListener('mousedown', () => {
    window.focus();
    startFlight();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  camera.position.set(0, START_ALT + 5, 22);
  camera.lookAt(0, START_ALT, 0);

  function animate() {
    requestAnimationFrame(animate);
    updateFlight();
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
