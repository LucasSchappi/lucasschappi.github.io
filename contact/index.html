<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">

      Schappi Studios

    <nav class="nav" id="primary-nav" aria-label="Main">
      <a href="/games/">Games</a>

    </nav>

            aria-controls="primary-nav" aria-label="Menu"><span></span></button>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <h1>Contact</h1>
      <p><span class="todo">[expected response time]</span></p>
    </div>
  </section>
  <section class="section">
    <div class="wrap">
      <!-- SLOT: .contact-cards -->
      <div class="split split--sidebar">
        <div>
          <form data-form action="" method="post">
            <div class="field">
              <label for="c-name">Your name</label>
              <input id="c-name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="c-email">Email</label>
              <input id="c-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="c-msg">Message</label>
              <textarea id="c-msg" name="message" required></textarea>
            </div>
            <button class="btn" type="submit">Send message</button>
            <p class="form-status" role="status"></p>
          </form>
        </div>
        <aside class="facts">
          <h3>Studio</h3>
          <dl><!-- SLOT: details --></dl>
        </aside>
      </div>
    </div>
  </section>
</main>
